<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>منصة عَنّة الذكية</title>
  <meta name="description" content="المنصة الرقمية لمدينة عَنّة — خدمات، مبادرات، توأم رقمي ثلاثي الأبعاد، وبيانات مفتوحة." />
  <meta name="theme-color" content="#ffffff" />

  <!-- PWA -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.png" />

  <!-- خطوط -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50:'#fff8ec',100:'#ffefd3',200:'#ffe1a6',300:'#ffd074',400:'#f7b53c',
              500:'#d79a19',600:'#b07b12',700:'#8a5f0e',800:'#6a490b',900:'#4a3308'
            },
            ink: {50:'#f9fafb',100:'#eef2f7',200:'#e7ecf3',300:'#dfe6ee',700:'#374151',900:'#1f2937'},
            accent: {blue:'#2563eb',green:'#10b981',purple:'#7c3aed',rose:'#f43f5e',amber:'#f59e0b'}
          },
          boxShadow:{soft:'0 10px 30px rgba(2, 6, 23, .08)'},
          borderRadius:{xl2:'1.25rem'},
          keyframes:{
            float:{ '0%,100%':{transform:'translateY(0)'}, '50%':{transform:'translateY(-6px)'} },
            pulseSoft:{ '0%,100%':{opacity:.35}, '50%':{opacity:.85} },
            drift:{ '0%':{backgroundPosition:'0% 0%'}, '100%':{backgroundPosition:'200% 0%'} },
            ticker:{ '0%':{transform:'translateX(0)'}, '100%':{transform:'translateX(-50%)'} }
          },
          animation:{
            float:'float 4s ease-in-out infinite',
            pulseSoft:'pulseSoft 3s ease-in-out infinite',
            drift:'drift 18s linear infinite',
            ticker:'ticker 22s linear infinite'
          }
        }
      }
    }
  </script>

  <style>
    html { scroll-behavior: smooth; }
    body { font-family: 'Cairo', sans-serif; background: #f9fafb; color: #1f2937; }
    .section-head { display:inline-flex; align-items:center; gap:.6rem; padding:.55rem 1rem; border-radius:999px; background:#fff; box-shadow:0 6px 18px rgba(0,0,0,.07); }
    .section-head .dot { width:.6rem; height:.6rem; border-radius:50%; background:#d79a19; }
    .card { background:#fff; border:1px solid #e5e7eb; border-radius:1rem; padding:1.25rem; transition:.25s transform,.25s box-shadow; }
    .card:hover { transform:translateY(-3px); box-shadow:0 12px 28px rgba(2,6,23,.08); }

    .smart-bg { position:absolute; inset:-2px; z-index:-1;
      background: radial-gradient(1000px 300px at 90% -10%, rgba(247,181,60,.18), transparent 60%),
                  linear-gradient(90deg, rgba(37,99,235,.06), rgba(16,185,129,.06), rgba(124,58,237,.06), rgba(244,63,94,.06));
      background-size:200% 100%; animation:drift 22s linear infinite; filter:saturate(1.05);
    }

    .city-nodes { position:absolute; inset:0; pointer-events:none; }
    .city-nodes .n { position:absolute; width:6px; height:6px; border-radius:50%;
      background:#10b981; box-shadow:0 0 12px rgba(16,185,129,.5); animation:pulseSoft 3s ease-in-out infinite;
    }
    .city-nodes .n:nth-child(odd){ background:#2563eb; box-shadow:0 0 12px rgba(37,99,235,.45); animation-duration: 2.4s; }

    .hero-figure{background:url('/assets/img/hero-city.jpg') center/cover no-repeat; position:relative}
    .hero-figure::after{
      content:''; position:absolute; inset:0;
      background:linear-gradient(270deg, rgba(249,250,251,0.95) 0%, rgba(249,250,251,0.45) 40%, rgba(249,250,251,0) 65%);
    }
  </style>
</head>

<body>

<header class="fixed top-0 inset-x-0 bg-white/90 backdrop-blur border-b border-ink-200 z-50">
  <div class="max-w-6xl mx-auto flex justify-between items-center px-4 h-14">
    <a href="/" class="font-bold text-brand-700 text-lg flex items-center gap-2">
      <span class="inline-grid place-items-center w-8 h-8 rounded-xl bg-brand-500 text-white">ع</span>
      منصة عَنّة الذكية
    </a>
    <nav class="hidden md:flex gap-4 text-sm font-semibold">
      <a href="#services" class="text-ink-700 hover:text-ink-900">الخدمات</a>
      <a href="#platforms" class="text-ink-700 hover:text-ink-900">المنصّات</a>
      <a href="/digital-twin.html" class="text-ink-700 hover:text-ink-900">توأم عَنّة الرقمي</a>
      <a href="#opendata" class="text-ink-700 hover:text-ink-900">البيانات المفتوحة</a>
      <a href="#strategy" class="text-ink-700 hover:text-ink-900">الاستراتيجية</a>
    </nav>
  </div>
</header>

<section class="relative pt-24 pb-8">
  <div class="smart-bg"></div>

  <div class="max-w-6xl mx-auto px-4 grid md:grid-cols-2 gap-10 items-center">

    <div>
      <div class="section-head mb-3"><span class="dot"></span><span>مدينة عَنّة الذكية</span></div>
      <h1 class="text-4xl font-extrabold mb-3 text-ink-900">خدمات حديثة، بيانات حية، ومبادرات ذكية</h1>
      <p class="text-ink-700 mb-6">وصول موحّد إلى البلاغات ولوحات البيانات.</p>

      <div class="flex gap-3 flex-wrap">

        <a href="#services"
           class="bg-brand-500 text-white px-5 py-3 rounded-xl shadow-soft hover:bg-brand-600">
           استكشف الخدمات
        </a>

        <!-- زر التقرير -->
        <a href="#report"
           class="flex items-center gap-2 px-6 py-3 rounded-xl
                  bg-gradient-to-r from-brand-500 via-brand-600 to-brand-700
                  text-white font-bold shadow-soft hover:scale-105 transition-all">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none"
               viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M9 12h6m-6 4h6M7 4h10a2 2 0 012 2v12a2 2 0 01-2 2H7a2 2 0 01-2-2V6a2 2 0 012-2z" />
          </svg>
          مشروع مدينة عَنّة الذكية
        </a>

      </div>
    </div>

    <div>
      <figure class="hero-figure w-full h-72 md:h-[380px] rounded-2xl shadow-soft overflow-hidden"></figure>
    </div>

  </div>
</section>

<section id="report" class="py-20 bg-white">
  <div class="max-w-6xl mx-auto px-4">

    <div class="section-head mb-3">
      <span class="dot"></span>
      <span>التقرير الرسمي</span>
    </div>

    <h2 class="text-3xl font-bold mb-6 text-ink-900">
      مشروع مدينة عَنّة الذكية
    </h2>

    <div class="flex gap-4 flex-wrap mb-8">

      <a href="/assets/reports/anah-smart-city.pdf" target="_blank"
         class="bg-brand-500 text-white px-6 py-3 rounded-xl shadow-soft hover:bg-brand-600">
        📄 عرض التقرير
      </a>

      <a href="/assets/reports/anah-smart-city.pdf" download
         class="border border-ink-300 px-6 py-3 rounded-xl hover:bg-ink-100">
        ⬇ تحميل PDF
      </a>

    </div>

    <div class="w-full h-[600px] rounded-2xl overflow-hidden border border-ink-200 shadow-soft">
      <iframe src="/assets/reports/anah-smart-city.pdf" class="w-full h-full"></iframe>
    </div>

  </div>
</section>

</body>
</html>
